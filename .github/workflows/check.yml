name: Collector and review desk checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node20-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '20'
      - run: npm test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -v
      - run: npm test
      - run: python3 scripts/build-sample.py
      - run: git diff --exit-code -- app/sample.js examples/sample-report.json
      - name: Install and execute the self-contained skill
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          gapcue_temp="$(mktemp -d)"
          mkdir "$gapcue_temp/source" "$gapcue_temp/project"
          git archive HEAD | tar -x -C "$gapcue_temp/source"
          cd "$gapcue_temp/project"
          npx --yes skills@1.7.4 add "$gapcue_temp/source" --skill gapcue --agent codex --copy --yes
          node "$GITHUB_WORKSPACE/tests/skill-install.cjs" "$gapcue_temp/project/.agents/skills/gapcue"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:research
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:repos
      - run: npm run test:compare
        env:
          BROWSER_CHANNEL: chromium
      - run: npm run test:atlas
        env:
          BROWSER_CHANNEL: chromium
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: error
